version: '3.8'

services:
  fair-split:
    build: .
    container_name: fair-split-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ALLOWED_ORIGINS=*
    env_file:
      - .env
    restart: unless-stopped
